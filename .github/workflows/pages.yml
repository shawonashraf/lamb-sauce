name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# GITHUB_TOKEN needs these for the Pages deployment to authenticate.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-applied
# deploy is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        # Tries to turn Pages on via the API. GITHUB_TOKEN often cannot create
        # a Pages site ("Resource not accessible by integration"), in which
        # case enable it once with your own credentials and re-run:
        #   gh api -X POST repos/OWNER/REPO/pages -f build_type=workflow
        # or set Settings > Pages > Source to "GitHub Actions".
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
